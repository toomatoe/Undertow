services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: quantdesk
      POSTGRES_PASSWORD: quantdesk
      POSTGRES_DB: quantdesk
    ports:
      - "127.0.0.1:5432:5432"  # local only: never expose the dev database
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantdesk"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://quantdesk:quantdesk@db:5432/quantdesk
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"  # local only; put a reverse proxy in front for public deploys
    volumes:
      - apidata:/app/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  apidata:
