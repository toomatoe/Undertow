# Local stack. QuantDesk runs on your own machine only: every port binds to 127.0.0.1.
#   docker compose up -d --build                  db + api (run the UI with `npm --prefix frontend run dev`)
#   docker compose --profile web up -d --build    db + api + web (UI at http://localhost:3000, no Node needed)
# Windows: scripts/start.ps1 does the above (and creates .env from .env.example on first run).
# The `web` service sits behind a profile, so a plain `up` never collides with an `npm run dev` server on :3000.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: quantdesk
      POSTGRES_PASSWORD: quantdesk
      POSTGRES_DB: quantdesk
    ports:
      - "127.0.0.1:5432:5432"  # local only: never expose the dev database
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantdesk"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://quantdesk:quantdesk@db:5432/quantdesk
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8000:8000"  # local only
    volumes:
      - apidata:/app/data
    depends_on:
      db:
        condition: service_healthy

  # Optional UI container (opt-in): docker compose --profile web up -d --build
  web:
    profiles: ["web"]
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle: the browser reaches the API and the site on localhost.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    environment:
      API_URL_INTERNAL: http://api:8000  # server-side fetches from inside the compose network
    ports:
      - "127.0.0.1:3000:3000"  # local only
    depends_on:
      - api

volumes:
  pgdata:
  apidata:
